<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
<title>Jarvis</title><link rel="stylesheet" href="style.css"></head>
<body data-state="connecting">
<header><span class="wordmark">JARVIS<span class="dot"> · </span></span><span id="status" role="status" aria-live="polite">CONECTANDO</span><span class="local">LOCAL</span></header>
<main>
 <div class="orb-area"><button id="orb" aria-label="Abrir ou recolher conversa" aria-expanded="false">
  <span class="halo"></span><span class="orbit one"></span><span class="orbit two"></span><span class="orbit three"></span><span class="orbit four"></span><span class="orbit five"></span><span class="core"></span><span class="orb-label">JARVIS</span>
 </button><p id="hint">Seu espaço para pensar e construir.</p></div>
 <aside id="system" class="panel left" hidden><div class="panel-heading"><h2>SISTEMA</h2><button data-close="system" aria-label="Fechar sistema">×</button></div><p id="model">Modelo local</p><p id="resources">Consultando recursos…</p><p class="muted">Voz e agenda ainda não conectadas.</p></aside>
 <aside id="activity" class="panel right" hidden><div class="panel-heading"><h2>ATIVIDADE</h2><button data-close="activity" aria-label="Fechar atividade">×</button></div><ol id="logs"><li>Nenhuma tarefa iniciada.</li></ol></aside>
 <section id="conversation" class="conversation" hidden aria-label="Conversa com Jarvis"><div class="panel-heading"><h2>CONVERSA</h2><button data-close="conversation" aria-label="Recolher conversa">×</button></div><div id="messages" role="log" aria-live="polite"></div></section>
 <div class="composer"><form id="form"><label for="input" class="sr-only">Seu pedido</label><input id="input" placeholder="O que vamos fazer?" maxlength="16000" autocomplete="off" disabled><button id="send" type="submit" aria-label="Enviar pedido" disabled>↗</button></form><button id="stop" hidden>Interromper</button><button id="reconnect" hidden>Reconectar</button></div>
</main><footer><button id="system-toggle" aria-controls="system" aria-expanded="false">Sistema</button><button id="chat-toggle" aria-controls="conversation" aria-expanded="false">Conversa</button><button id="activity-toggle" aria-controls="activity" aria-expanded="false">Atividade</button><span id="latency"></span></footer>
<script src="renderer.js"></script></body></html>
